name: Generate Daily News Podcast

on:
  schedule:
    - cron: "0 22 * * *"   # UTC 22:00 = 北京 06:00 → 国际新闻（EDITION=morning）
    - cron: "0 12 * * *"   # UTC 12:00 = 北京 20:00 → 国内时政军事/文教卫/体育（EDITION=evening）
  workflow_dispatch:       # 手动触发测试，可指定时段
    inputs:
      edition:
        description: "发布时段（morning=国际；evening=晚间三篇；all=全部四篇）"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - evening
          - all

permissions:
  contents: write          # 允许 publish.py 用 GITHUB_TOKEN 推送 feed.xml 与音频

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 定时触发时按匹配的 cron 决定时段；手动触发时用所选 edition
      EDITION: ${{ github.event_name == 'schedule' && (github.event.schedule == '0 22 * * *' && 'morning' || 'evening') || inputs.edition }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与 ffmpeg
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 显示本次时段
        run: echo "EDITION=${EDITION}"

      - name: 1. 抓取新闻
        run: python scripts/fetch_news.py

      - name: 2. 润色文稿（每类目独立成稿）
        run: python scripts/polish.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: 3. 生成语音（每类目独立音频）
        run: python scripts/tts.py

      - name: 4. 发布到 Pages 并更新 feed
        run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
