name: Generate Daily News Podcast

on:
  schedule:
    - cron: "0 12 * * *"   # UTC 12:00 = 北京 20:00 → 每天一期整合简报（国际+国内时政军事+文教卫+体育）
  workflow_dispatch:       # 手动触发测试
    inputs:
      edition:
        description: "发布范围（daily=每天一期整合简报，抓取全部四类）"
        required: true
        default: "daily"
        type: choice
        options:
          - daily

permissions:
  contents: write          # 允许 publish.py 用 GITHUB_TOKEN 推送 feed.xml 与音频

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 每天一期整合简报：一次抓全四类、合成单集（定时与手动触发均为 all）
      EDITION: all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与 ffmpeg
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 1. 抓取新闻（过去 24 小时，四类）
        run: python scripts/fetch_news.py

      - name: 2. 润色文稿（每类目独立成稿）
        run: python scripts/polish.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: 3. 合并为整合文稿（全局连续编号 第1条…第N条）
        run: python scripts/merge_scripts.py

      - name: 4. 生成语音（单集音频）
        run: python scripts/tts.py

      - name: 5. 发布到 Pages 并更新 feed
        run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
