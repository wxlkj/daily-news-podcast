name: Generate Daily News Podcast

on:
  schedule:
    - cron: "30 21 * * *"   # 北京时间 05:30（UTC 21:30）
  workflow_dispatch:         # 支持手动触发测试

permissions:
  contents: write            # 允许 publish.py 用 GITHUB_TOKEN 推送 feed.xml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖与 ffmpeg
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 1. 抓取新闻
        run: python scripts/fetch_news.py

      - name: 2. 润色文稿
        run: python scripts/polish.py
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

      - name: 3. 生成语音
        run: python scripts/tts.py

      - name: 4. 发布到 Release + 更新 RSS
        run: python scripts/publish.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
