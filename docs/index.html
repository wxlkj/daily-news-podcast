<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>每日新闻简报</title>
  <meta name="theme-color" content="#0f1a2e" />
  <style>
    :root {
      --bg: #0f1a2e;
      --bg2: #16243d;
      --card: #1b2c49;
      --accent: #4c8dff;
      --text: #eef3fb;
      --sub: #9fb2d0;
      --line: #2a3c5e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: linear-gradient(160deg, var(--bg), var(--bg2));
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 120px;
    }
    .wrap { max-width: 640px; margin: 0 auto; padding: 22px 16px; }
    header { display: flex; gap: 16px; align-items: center; margin-bottom: 22px; }
    .cover {
      width: 92px; height: 92px; border-radius: 16px;
      object-fit: cover; flex-shrink: 0;
      box-shadow: 0 8px 22px rgba(0,0,0,.45);
      background: #20324f;
    }
    .title { font-size: 21px; font-weight: 700; margin: 0 0 6px; }
    .desc { font-size: 13px; color: var(--sub); line-height: 1.5; margin: 0; }
    h2.section { font-size: 14px; color: var(--sub); font-weight: 600; margin: 8px 2px 10px; letter-spacing: .5px; }
    /* 类目筛选标签 */
    .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 2px 14px; }
    .chip {
      padding: 6px 14px; border-radius: 999px; font-size: 13px;
      border: 1px solid var(--line); background: var(--card); color: var(--sub);
      cursor: pointer; user-select: none; transition: background .15s, color .15s;
    }
    .chip:active { transform: scale(.96); }
    .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    /* 节目卡片 */
    .ep {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 15px; margin-bottom: 12px;
      display: flex; gap: 12px; align-items: center; cursor: pointer;
      transition: border-color .15s, transform .05s;
    }
    .ep:active { transform: scale(.99); }
    .ep.active { border-color: var(--accent); }
    .ep .play-ico {
      width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    .ep .play-ico svg { width: 18px; height: 18px; fill: #fff; }
    .ep .meta { min-width: 0; flex: 1; }
    .ep .ep-title { font-size: 15px; font-weight: 600; margin: 0 0 5px; }
    .ep .ep-date { font-size: 12px; color: var(--sub); }
    /* 下载 / 复制 按钮组 */
    .dl-actions { display: flex; flex-shrink: 0; gap: 6px; align-items: center; }
    .dl-btn {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid var(--line); background: rgba(76,141,255,.14);
      display: flex; align-items: center; justify-content: center;
      color: var(--accent); cursor: pointer; padding: 0; font: inherit;
    }
    .dl-btn.cp-btn { background: rgba(159,178,208,.10); color: var(--sub); }
    .dl-btn:active { transform: scale(.94); }
    .dl-btn:disabled { opacity: .55; }
    .dl-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    /* 操作提示条 */
    .tip {
      font-size: 12px; color: var(--sub); line-height: 1.6;
      background: rgba(76,141,255,.08); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 12px; margin: 0 2px 14px;
    }
    /* 轻量状态提示 */
    .toast {
      position: fixed; left: 50%; bottom: 104px; transform: translateX(-50%);
      background: #0b1729; color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 11px 16px; font-size: 13px; line-height: 1.5;
      max-width: 86%; width: max-content; text-align: center;
      box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 60;
      opacity: 0; pointer-events: none; transition: opacity .25s;
    }
    .toast.show { opacity: 1; }
    .badge {
      display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 6px;
      color: #fff; margin-right: 6px; vertical-align: middle;
    }
    .loading { text-align: center; color: var(--sub); padding: 40px 0; font-size: 14px; }
    /* 底部播放条 */
    .player {
      position: fixed; left: 0; right: 0; bottom: 0;
      background: rgba(20,32,53,.96); backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      display: none;
    }
    .player.show { display: block; }
    .player-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .p-cover { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; background:#20324f; flex-shrink:0; }
    .p-info { flex: 1; min-width: 0; }
    .p-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .p-bar { position: relative; height: 22px; margin-top: 7px; cursor: pointer; touch-action: none; }
    .p-track {
      position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%);
      height: 4px; background: var(--line); border-radius: 3px; overflow: hidden;
    }
    .p-prog { height: 100%; width: 0; background: var(--accent); border-radius: 3px; }
    .p-handle {
      position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin-left: -6px;
      transform: translateY(-50%); background: #fff; border-radius: 50%;
      box-shadow: 0 1px 4px rgba(0,0,0,.45); pointer-events: none;
    }
    .p-time { font-size: 11px; color: var(--sub); margin-top: 4px; display: flex; justify-content: space-between; }
    .p-status { font-size: 11px; color: #ffb454; margin-top: 3px; min-height: 14px; }
    .p-status.err { color: #ff7a7a; }
    .p-btn {
      width: 46px; height: 46px; border-radius: 50%; border: none; flex-shrink: 0;
      background: var(--accent); display: flex; align-items: center; justify-content: center;
    }
    .p-btn svg { width: 20px; height: 20px; fill: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="cover" id="cover" alt="封面" />
      <div>
        <h1 class="title" id="ch-title">每日新闻简报</h1>
        <p class="desc" id="ch-desc">加载中…</p>
      </div>
    </header>
    <h2 class="section">节目列表</h2>
    <p class="tip">点每集右侧「↓」下载音频（国内 CDN 加速，通常几秒即可存到本机）；点「⧉」复制<strong>强制下载链接</strong>。若在微信 / App 内置浏览器里下载受限，把复制的链接粘贴到<strong>系统浏览器地址栏</strong>打开，会直接下载文件，不会再变成播放或提示失败。</p>
    <div class="filters" id="filters"></div>
    <div id="list"><div class="loading">正在加载最新节目…</div></div>
  </div>

  <div class="toast" id="toast"></div>

  <div class="player" id="player">
    <div class="player-inner">
      <img class="p-cover" id="p-cover" alt="" />
      <div class="p-info">
        <div class="p-title" id="p-title">—</div>
        <div class="p-status" id="p-status"></div>
        <div class="p-bar" id="p-bar">
          <div class="p-track"><div class="p-prog" id="p-prog"></div></div>
          <div class="p-handle" id="p-handle"></div>
        </div>
        <div class="p-time"><span id="p-cur">0:00</span><span id="p-dur">0:00</span></div>
      </div>
      <button class="p-btn" id="p-btn" aria-label="播放/暂停">
        <svg id="p-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <audio id="audio" preload="none"></audio>
  </div>

  <script>
    const ITUNES = "http://www.itunes.com/dtds/podcast-1.0.dtd";
    const $ = (id) => document.getElementById(id);
    const audio = $("audio");
    const bar = $("p-bar");
    const handle = $("p-handle");
    let current = null;
    let dragging = false;
    let episodes = [];
    let filter = "all";

    // 类目 key -> 展示信息（与 feed.xml 的 <category> 对应）
    const CATS = {
      international:      { label: "国际",     color: "#4c8dff" },
      politics_mil:       { label: "时政军事", color: "#ff7a7a" },
      culture_edu_health: { label: "文教卫",   color: "#57c98a" },
      sports:             { label: "体育",     color: "#e6a23c" },
      legacy:             { label: "往期",     color: "#8a9bbd" },
    };
    const FILTERS = [
      { key: "all",                 label: "全部" },
      { key: "international",       label: "国际" },
      { key: "politics_mil",        label: "时政军事" },
      { key: "culture_edu_health",  label: "文教卫" },
      { key: "sports",              label: "体育" },
    ];

    function esc(s) {
      return (s || "").replace(/[&<>"]/g, (c) =>
        ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }
    function parseDate(s) {
      if (!s) return null;
      let d = new Date(s);
      if (isNaN(d.getTime())) d = new Date(s.replace(/\s(\+\d{2})(\d{2})$/, " $1:$2"));
      return isNaN(d.getTime()) ? null : d;
    }
    function fmtDate(s) {
      const d = parseDate(s);
      if (!d) return s;
      return (d.getMonth() + 1) + "月" + d.getDate() + "日 " +
             String(d.getHours()).padStart(2, "0") + ":" +
             String(d.getMinutes()).padStart(2, "0");
    }

    /* ---------- 下载音频：Blob 下载 + 复制链接兜底 ---------- */
    let toastTimer = null;
    function toast(msg, ms = 4000) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), ms);
    }

    async function copyText(text) {
      // 优先用现代 API；App 内置 WebView 里常不可用，降级到 execCommand
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) { /* 继续降级 */ }
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.cssText = "position:fixed;top:-9999px;opacity:0";
        document.body.appendChild(ta);
        ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) { return false; }
    }

    // 微信 / App 内置 WebView 会把 download 当成"导航播放音频"而报下载失败，
    // 这类环境干脆不触发下载动作，直接给复制好的直链。
    function isRestrictedBrowser() {
      return /MicroMessenger|; wv\)|QQBrowser|Weibo|DingTalk|Alipay|Feishu/i
        .test(navigator.userAgent || "");
    }

    // ── 下载源 ──
    // github.io 原链没有 Content-Disposition，浏览器打开会「播放」而非下载；
    // jsDelivr CDN 快且允许跨域(CORS)，适合 fetch→Blob 后强制下载；
    // raw.githubusercontent.com 带 Content-Disposition: attachment，
    // 复制到系统浏览器打开即直接下载，不会变成播放。
    const GH_OWNER = "wxlkj", GH_REPO = "daily-news-podcast";
    function fnameOf(url) {
      return (url || "").split("/").pop().split("?")[0] || "episode.mp3";
    }
    function cdnSources(url) {
      const f = fnameOf(url);
      return [
        `https://cdn.jsdelivr.net/gh/${GH_OWNER}/${GH_REPO}@main/docs/audio/${f}`,
        `https://gcore.jsdelivr.net/gh/${GH_OWNER}/${GH_REPO}@main/docs/audio/${f}`,
        url, // 同源 github.io 兜底（慢但一定可取）
      ];
    }
    function forceDownloadUrl(url) {
      return `https://raw.githubusercontent.com/${GH_OWNER}/${GH_REPO}/main/docs/audio/${fnameOf(url)}`;
    }

    async function fetchAudio(url) {
      // 依次尝试各源（快的 CDN 优先），返回 Blob
      let lastErr;
      for (const src of cdnSources(url)) {
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 90000);
          let res;
          try {
            res = await fetch(src, { signal: ctrl.signal, cache: "no-store" });
          } finally {
            clearTimeout(timer);
          }
          if (!res.ok) throw new Error("HTTP " + res.status);
          const blob = await res.blob();
          if (!blob || blob.size < 1024) throw new Error("空文件");
          return blob;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("全部下载源失败");
    }

    async function copyEpisodeLink(url, btn) {
      // 复制「强制下载链接」：带 attachment 头，粘贴到系统浏览器打开即下载，
      // 不会再变成播放 /「下载失败」。
      const ok = await copyText(forceDownloadUrl(url));
      toast(ok
        ? "已复制强制下载链接：粘贴到系统浏览器地址栏打开，会直接下载音频文件"
        : "复制受限，请点右上角「在浏览器中打开」后再试", 9000);
      if (btn) { btn.disabled = false; }
    }

    async function downloadEpisode(url, fname, btn) {
      if (!url) return;
      // ① 微信 / App 内置 WebView：下载动作会被拦成「播放音频」而报失败，
      //    直接复制强制下载链接，引导到系统浏览器打开（打开即下载）。
      if (isRestrictedBrowser()) {
        const ok = await copyText(forceDownloadUrl(url));
        toast(ok
          ? "此浏览器不支持直接下载，已复制强制下载链接；请粘贴到系统浏览器地址栏打开，会直接下载"
          : "请在系统浏览器（Chrome / 一加浏览器）中打开本页再下载", 10000);
        return;
      }
      // ② 标准浏览器：fetch 成 Blob，再用 blob: 链接配合 <a download> 强制存文件。
      //    blob: 属同源，download 属性一定生效，不会被当成音频导航播放。
      if (btn) btn.disabled = true;
      toast("正在准备音频，国内加速通常几秒…", 60000);
      try {
        const blob = await fetchAudio(url);
        const objUrl = URL.createObjectURL(
          new Blob([blob], { type: "application/octet-stream" }));
        const a = document.createElement("a");
        a.href = objUrl;
        a.download = fname || fnameOf(url);
        a.style.display = "none";
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { a.remove(); URL.revokeObjectURL(objUrl); }, 60000);
        toast("已开始下载，请在通知栏或「文件 / 下载」中查看", 7000);
      } catch (err) {
        // ③ 极端情况（各源均不可达）：不做任何会导航离开页面的动作，
        //    只复制强制下载链接，交给系统浏览器打开（打开即下载）。
        const ok = await copyText(forceDownloadUrl(url));
        toast(ok
          ? "网络不可用，已复制强制下载链接；请在网络恢复后粘贴到系统浏览器地址栏打开，会直接下载"
          : "下载受限，请点右上角「在浏览器中打开」后再点下载", 10000);
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function renderFilters() {
      const box = $("filters");
      box.innerHTML = "";
      FILTERS.forEach((f) => {
        const el = document.createElement("div");
        el.className = "chip" + (f.key === filter ? " on" : "");
        el.textContent = f.label;
        el.onclick = () => { filter = f.key; renderFilters(); renderList(); };
        box.appendChild(el);
      });
    }

    function renderList() {
      const list = $("list");
      list.innerHTML = "";
      const shown = episodes.filter((e) => filter === "all" || e.cat === filter);
      if (!shown.length) {
        list.innerHTML = '<div class="loading">该分类暂无节目</div>';
        return;
      }
      shown.forEach((e) => {
        const c = CATS[e.cat] || CATS.legacy;
        const mins = e.length ? Math.round(e.length * 8 / 64000 / 60) : 0;
        const dur = mins ? " · 约" + mins + "分钟" : "";
        const el = document.createElement("div");
        el.className = "ep" + (e.url === current ? " active" : "");
        const fname = (e.url.split("/").pop() || "episode.mp3").split("?")[0];
        el.innerHTML = `
          <div class="play-ico"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
          <div class="meta">
            <p class="ep-title">${esc(e.title)}</p>
            <span class="ep-date"><span class="badge" style="background:${c.color}">${c.label}</span>${fmtDate(e.pub)}${dur}</span>
          </div>
          <div class="dl-actions">
            <button class="dl-btn" title="下载本集音频" aria-label="下载本集音频">
              <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 17v2a2 2 0 002 2h10a2 2 0 002-2v-2"/></svg>
            </button>
            <button class="dl-btn cp-btn" title="复制音频直链" aria-label="复制音频直链">
              <svg viewBox="0 0 24 24"><path d="M9 9h10a1 1 0 011 1v10a1 1 0 01-1 1H9a1 1 0 01-1-1V10a1 1 0 011-1zM5 15H4a1 1 0 01-1-1V4a1 1 0 011-1h10a1 1 0 011 1v1"/></svg>
            </button>
          </div>`;
        el.onclick = () => play(e.url, e.title, el);
        // 两个按钮都只做各自动作，不冒泡触发播放
        el.querySelector(".dl-btn:not(.cp-btn)").addEventListener("click", (ev) => {
          ev.stopPropagation();
          downloadEpisode(e.url, fname, ev.currentTarget);
        });
        el.querySelector(".cp-btn").addEventListener("click", (ev) => {
          ev.stopPropagation();
          copyEpisodeLink(e.url, ev.currentTarget);
        });
        list.appendChild(el);
      });
    }

    async function load() {
      try {
        const res = await fetch("feed.xml", { cache: "no-cache" });
        const text = await res.text();
        const doc = new DOMParser().parseFromString(text, "text/xml");
        const ch = doc.querySelector("channel");
        const chTitle = (ch.querySelector("title") || {}).textContent || "每日新闻简报";
        const chDesc = (ch.querySelector("description") || {}).textContent || "";
        const imgEl = ch.getElementsByTagNameNS(ITUNES, "image")[0]
                   || ch.getElementsByTagName("itunes:image")[0];
        const cover = imgEl ? imgEl.getAttribute("href") : "";
        $("ch-title").textContent = chTitle;
        $("ch-desc").textContent = chDesc;
        if (cover) { $("cover").src = cover; $("p-cover").src = cover; }

        episodes = Array.from(doc.getElementsByTagName("item")).map((it) => {
          const title = (it.querySelector("title") || {}).textContent || "未命名节目";
          const pub = (it.querySelector("pubDate") || {}).textContent || "";
          const enc = it.getElementsByTagName("enclosure")[0];
          const url = enc ? enc.getAttribute("url") : "";
          const length = enc ? parseInt(enc.getAttribute("length") || "0", 10) : 0;
          const catRaw = (it.querySelector("category") || {}).textContent || "";
          const cat = CATS[catRaw] ? catRaw : "legacy";
          const d = parseDate(pub);
          return { title, pub, url, length, cat, ts: d ? d.getTime() : 0 };
        }).sort((a, b) => b.ts - a.ts);

        renderFilters();
        renderList();
      } catch (e) {
        $("list").innerHTML = '<div class="loading">加载失败，请稍后刷新重试</div>';
        console.error(e);
      }
    }

    /* ---------- 播放控制（含可拖动进度条） ---------- */
    function updateProgress(p) {
      p = Math.max(0, Math.min(100, p));
      $("p-prog").style.width = p + "%";
      handle.style.left = p + "%";
    }
    function posToRatio(clientX) {
      const rect = bar.getBoundingClientRect();
      return Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    }
    function dragStart(e) {
      if (!audio.duration || isNaN(audio.duration)) return;
      dragging = true;
      dragMove(e);
    }
    function dragMove(e) {
      if (!dragging) return;
      const x = e.touches ? e.touches[0].clientX : e.clientX;
      const r = posToRatio(x);
      updateProgress(r * 100);
      $("p-cur").textContent = fmt(r * audio.duration);
      if (e.cancelable) e.preventDefault();
    }
    function dragEnd(e) {
      if (!dragging) return;
      dragging = false;
      const x = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
      const r = posToRatio(x);
      if (audio.duration) audio.currentTime = r * audio.duration;
    }
    bar.addEventListener("touchstart", dragStart, { passive: false });
    bar.addEventListener("touchmove", dragMove, { passive: false });
    bar.addEventListener("touchend", dragEnd);
    bar.addEventListener("mousedown", dragStart);
    document.addEventListener("mousemove", dragMove);
    document.addEventListener("mouseup", dragEnd);

    function fmt(s) {
      if (!s || isNaN(s)) return "0:00";
      s = Math.floor(s);
      return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
    }

    function play(url, title, el) {
      if (!url) return;
      document.querySelectorAll(".ep").forEach((x) => x.classList.remove("active"));
      if (el) el.classList.add("active");
      $("p-title").textContent = title;
      $("player").classList.add("show");
      const st = $("p-status");
      st.classList.remove("err");
      st.textContent = "加载中…";
      if (current !== url) {
        audio.src = url;
        current = url;
      }
      audio.play().catch((e) => {
        st.textContent = "播放失败，请检查网络后下拉刷新";
        st.classList.add("err");
        console.warn("播放失败:", e);
      });
    }

    function toggle() {
      if (!audio.src) return;
      if (audio.paused) audio.play().catch(() => {});
      else audio.pause();
    }

    $("p-btn").onclick = toggle;
    audio.onplay = () => { $("p-icon").innerHTML = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'; };
    audio.onpause = () => { $("p-icon").innerHTML = '<path d="M8 5v14l11-7z"/>'; };
    audio.ontimeupdate = () => {
      if (dragging) return;
      updateProgress(audio.duration ? (audio.currentTime / audio.duration) * 100 : 0);
      $("p-cur").textContent = fmt(audio.currentTime);
    };
    audio.onloadedmetadata = () => { $("p-dur").textContent = fmt(audio.duration); };
    audio.oncanplay = () => { const s = $("p-status"); s.textContent = ""; s.classList.remove("err"); };
    audio.onplaying = () => { const s = $("p-status"); s.textContent = ""; s.classList.remove("err"); };
    audio.onwaiting = () => { $("p-status").textContent = "缓冲中…"; };
    audio.onstalled = () => { $("p-status").textContent = "缓冲中…"; };
    audio.onerror = () => { const s = $("p-status"); s.textContent = "音频加载失败，请检查网络后刷新"; s.classList.add("err"); };

    load();
  </script>
</body>
</html>
