# 新闻来源配置（2026-11-04 重构：每天 4 篇分时段分主题）
#
# 抓取逻辑见 scripts/fetch_news.py。本文件：
#   - international 区块：被 fetch_news.py 直接读取（RSS 列表）
#   - 国内/文教卫/体育：使用央视各垂直频道网页抓取（URL 在 fetch_news.py 常量中），
#     此处仅作文档化登记，便于后续调整或排查。

# ── 国际新闻（早上 06:00 发布）──
# 境外 RSS：线上 runner 可抓；另在 fetch_news.py 的 INTL_RSS 常量中配置
# 人民网/中新网国际 RSS（境内域名）兜底，不依赖境外网络，两端都能抓到。
international:
  - name: BBC中文
    url: https://www.bbc.com/zhongwen/simp/index.xml
  - name: 德国之声中文
    url: https://www.dw.com/zh/%E4%B8%AD%E5%9B%BD/rss/s-7293
  - name: Reuters世界
    url: https://feeds.reuters.com/reuters/worldNews
  - name: AP News
    url: https://apnews.com/index.rss

# ── 国内时政·军事（晚上 20:00 发布）──
# 网页抓取：news.cctv.com 首页/国内/社会/军事 + 人民网·中新 RSS 补充。
# 军事关键词优先入选（见 fetch_news.py 的 MIL_KEYWORDS）。
domestic_politics_mil_web:
  - news.cctv.com/
  - news.cctv.com/china/
  - news.cctv.com/society/
  - news.cctv.com/military/
domestic_rss:
  - name: 人民网时政
    url: http://www.people.com.cn/rss/politics.xml
  - name: 中国新闻网国内
    url: https://www.chinanews.com.cn/rss/china.xml

# ── 文教卫：文化 / 教育 / 卫生健康（晚上 20:00 发布）──
# 央视三个垂直频道网页抓取，合并去重；
# 另由 fetch_news.py 的 EDU_RSS（人民网教育/文化）兜底补足条数。
education_health_web:
  - culture.cctv.com/    # 文化
  - edu.cctv.com/        # 教育
  - health.cctv.com/     # 卫生健康

# ── 体育（晚上 20:00 发布）──
# 央视体育频道网页抓取（条数偏少）；
# 另由 fetch_news.py 的 SPORTS_RSS（人民网/中新网体育）补足，确保素材够 10–20 分钟。
sports_web:
  - sports.cctv.com/
  - sports.cctv.com/football/
